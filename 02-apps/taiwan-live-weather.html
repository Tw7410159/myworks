<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣即時天氣觀測 | Taiwan Live Weather</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Phosphor Icons for weather & UI elements -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          },
          colors: {
            weather: {
              sunny: '#38bdf8',
              cloudy: '#64748b',
              rainy: '#0284c7',
              night: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar for hourly forecast */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Glassmorphism utility */
    .glass {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .dark .glass {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    /* Dynamic Weather Background Gradients */
    .bg-sunny {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
    }
    .dark .bg-sunny {
      background: linear-gradient(135deg, #0c4a6e 0%, #1e1b4b 100%);
    }
    .bg-rainy {
      background: linear-gradient(135deg, #475569 0%, #1e293b 100%);
    }
    .dark .bg-rainy {
      background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
    }
    .bg-cloudy {
      background: linear-gradient(135deg, #94a3b8 0%, #475569 100%);
    }
    .dark .bg-cloudy {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    }

    /* Pulse animation for loading shimmer */
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-sunny transition-colors duration-700 min-h-full font-sans text-slate-800 dark:text-slate-100 antialiased selection:bg-sky-500 selection:text-white pb-12">

  <!-- Background Animated Elements -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-20 -left-20 w-96 h-96 bg-white/20 rounded-full blur-3xl dark:bg-sky-500/10"></div>
    <div class="absolute top-1/3 -right-20 w-96 h-96 bg-amber-300/20 rounded-full blur-3xl dark:bg-purple-500/10"></div>
  </div>

  <div class="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">

    <!-- Header Navigation Bar -->
    <header class="glass rounded-2xl px-5 py-4 mb-6 shadow-lg flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-sky-500/20 rounded-xl text-sky-600 dark:text-sky-400">
            <i class="ph-bold ph-cloud-sun text-2xl"></i>
          </div>
          <h1 class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300">
            台灣即時天氣 <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-700 dark:text-sky-300">Open-Meteo</span>
          </h1>
        </div>
        <!-- Dark Mode Toggle Button for Mobile -->
        <button id="themeToggleMobile" class="md:hidden p-2.5 rounded-xl glass hover:bg-white/40 text-slate-700 dark:text-slate-200 transition-all">
          <i class="ph-bold ph-moon text-lg dark:hidden"></i>
          <i class="ph-bold ph-sun text-lg hidden dark:block"></i>
        </button>
      </div>

      <!-- Controls: City Selector, Search, GPS & Theme -->
      <div class="flex items-center gap-2.5 w-full md:w-auto">
        <!-- City Dropdown -->
        <div class="relative flex-1 md:w-56">
          <select id="citySelect" class="w-full appearance-none glass rounded-xl px-4 py-2.5 pr-10 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-sky-500/50 cursor-pointer shadow-sm text-slate-800 dark:text-slate-100">
            <!-- Cities rendered via JS -->
          </select>
          <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">
            <i class="ph-bold ph-caret-down text-sm"></i>
          </div>
        </div>

        <!-- Geolocation Button -->
        <button id="geoBtn" title="使用GPS定位目前位置" class="glass p-2.5 rounded-xl hover:bg-white/50 dark:hover:bg-slate-800/50 text-slate-700 dark:text-slate-200 transition-all shadow-sm flex items-center justify-center shrink-0">
          <i class="ph-bold ph-navigation-arrow text-lg text-sky-600 dark:text-sky-400"></i>
        </button>

        <!-- Dark Mode Toggle Button Desktop -->
        <button id="themeToggle" class="hidden md:flex p-2.5 rounded-xl glass hover:bg-white/50 dark:hover:bg-slate-800/50 text-slate-700 dark:text-slate-200 transition-all shadow-sm items-center justify-center shrink-0">
          <i class="ph-bold ph-moon text-lg dark:hidden"></i>
          <i class="ph-bold ph-sun text-lg hidden dark:block"></i>
        </button>
      </div>
    </header>

    <!-- Alert / Toast Container -->
    <div id="toast" class="hidden mb-4 p-4 rounded-xl glass border-l-4 border-amber-500 text-sm font-medium text-amber-800 dark:text-amber-200 shadow-md flex items-center justify-between transition-all">
      <div class="flex items-center gap-2">
        <i class="ph-bold ph-warning-circle text-xl"></i>
        <span id="toastMsg">通知訊息</span>
      </div>
      <button onclick="hideToast()" class="text-amber-600 dark:text-amber-400 hover:opacity-80"><i class="ph-bold ph-x text-base"></i></button>
    </div>

    <!-- Main Content Container -->
    <main id="mainContainer" class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Left Column: Current Weather Overview (Lg: 2 cols) -->
      <div class="lg:col-span-2 space-y-6">

        <!-- Main Real-time Weather Card -->
        <div class="glass rounded-3xl p-6 sm:p-8 shadow-xl relative overflow-hidden">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div>
              <div class="flex items-center gap-2">
                <i class="ph-fill ph-map-pin text-sky-600 dark:text-sky-400 text-xl"></i>
                <h2 id="cityName" class="text-2xl sm:text-3xl font-bold tracking-tight">載入中...</h2>
              </div>
              <p id="currentDate" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1 font-medium"></p>
            </div>
            <span id="updateTime" class="text-xs px-3 py-1.5 rounded-full bg-slate-200/50 dark:bg-slate-800/50 text-slate-600 dark:text-slate-300 font-medium">更新中...</span>
          </div>

          <!-- Weather Hero Stats -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 items-center my-4">
            <div class="flex items-center gap-4">
              <div id="weatherIcon" class="text-6xl sm:text-7xl text-sky-600 dark:text-sky-300 drop-shadow-md">
                <i class="ph-bold ph-sun animate-pulse-slow"></i>
              </div>
              <div>
                <div class="flex items-baseline">
                  <span id="tempCurrent" class="text-6xl font-black tracking-tight">--</span>
                  <span class="text-3xl font-bold text-slate-500 dark:text-slate-400 ml-1">°C</span>
                </div>
                <p id="weatherCondition" class="text-lg font-semibold text-slate-700 dark:text-slate-200 mt-1">--</p>
              </div>
            </div>

            <div class="bg-white/40 dark:bg-slate-900/40 rounded-2xl p-4 backdrop-blur-md space-y-2.5 border border-white/20 dark:border-slate-700/30">
              <div class="flex justify-between items-center text-sm">
                <span class="text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><i class="ph-bold ph-thermometer text-rose-500"></i> 體感溫度</span>
                <span id="feelsLike" class="font-bold">--°C</span>
              </div>
              <div class="flex justify-between items-center text-sm">
                <span class="text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><i class="ph-bold ph-arrow-up-down text-indigo-500"></i> 今日高/低溫</span>
                <span id="tempRange" class="font-bold">-- / --°C</span>
              </div>
              <div class="flex justify-between items-center text-sm">
                <span class="text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><i class="ph-bold ph-umbrella text-blue-500"></i> 降雨機率</span>
                <span id="pop" class="font-bold">--%</span>
              </div>
            </div>
          </div>

          <!-- Weather Metrics Grid -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-6 pt-6 border-t border-slate-200/40 dark:border-slate-700/40">
            <!-- Humidity -->
            <div class="bg-white/30 dark:bg-slate-800/30 rounded-xl p-3.5 flex items-center gap-3">
              <div class="p-2.5 bg-blue-500/10 text-blue-600 dark:text-blue-400 rounded-lg">
                <i class="ph-bold ph-drop text-xl"></i>
              </div>
              <div>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">相對濕度</p>
                <p id="humidity" class="text-base font-bold text-slate-800 dark:text-slate-100">--%</p>
              </div>
            </div>
            <!-- Wind Speed -->
            <div class="bg-white/30 dark:bg-slate-800/30 rounded-xl p-3.5 flex items-center gap-3">
              <div class="p-2.5 bg-teal-500/10 text-teal-600 dark:text-teal-400 rounded-lg">
                <i class="ph-bold ph-wind text-xl"></i>
              </div>
              <div>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">風速</p>
                <p id="windSpeed" class="text-base font-bold text-slate-800 dark:text-slate-100">-- km/h</p>
              </div>
            </div>
            <!-- UV Index -->
            <div class="bg-white/30 dark:bg-slate-800/30 rounded-xl p-3.5 flex items-center gap-3">
              <div class="p-2.5 bg-amber-500/10 text-amber-600 dark:text-amber-400 rounded-lg">
                <i class="ph-bold ph-sun-dim text-xl"></i>
              </div>
              <div>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">UV 指數</p>
                <p id="uvIndex" class="text-base font-bold text-slate-800 dark:text-slate-100">--</p>
              </div>
            </div>
            <!-- Air Pressure -->
            <div class="bg-white/30 dark:bg-slate-800/30 rounded-xl p-3.5 flex items-center gap-3">
              <div class="p-2.5 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 rounded-lg">
                <i class="ph-bold ph-gauge text-xl"></i>
              </div>
              <div>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">氣壓</p>
                <p id="pressure" class="text-base font-bold text-slate-800 dark:text-slate-100">-- hPa</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Hourly Forecast Horizontal Scroll -->
        <div class="glass rounded-3xl p-6 shadow-xl">
          <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
            <i class="ph-bold ph-clock text-sky-600 dark:text-sky-400"></i>
            24小時逐時預報
          </h3>
          <div id="hourlyContainer" class="flex gap-4 overflow-x-auto no-scrollbar pb-2 pt-1">
            <!-- Hourly items loaded via JS -->
            <div class="text-center py-6 w-full text-slate-500 text-sm">載入中...</div>
          </div>
        </div>

      </div>

      <!-- Right Column: 7-Day Forecast & Details (Lg: 1 col) -->
      <div class="space-y-6">

        <!-- 7-Day Weather Forecast -->
        <div class="glass rounded-3xl p-6 shadow-xl">
          <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
            <i class="ph-bold ph-calendar-blank text-sky-600 dark:text-sky-400"></i>
            未來一週預報
          </h3>
          <div id="dailyContainer" class="space-y-3">
            <!-- 7-day items loaded via JS -->
            <div class="text-center py-8 text-slate-500 text-sm">載入中...</div>
          </div>
        </div>

        <!-- Sunrise & Sunset Info Card -->
        <div class="glass rounded-3xl p-6 shadow-xl">
          <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
            <i class="ph-bold ph-sun-horizon text-amber-500"></i>
            日出與日落時間
          </h3>
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-white/40 dark:bg-slate-800/40 rounded-2xl p-4 text-center">
              <i class="ph-bold ph-sunrise text-3xl text-amber-500 mb-1 inline-block"></i>
              <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">日出時間</p>
              <p id="sunriseTime" class="text-lg font-bold mt-0.5">--:--</p>
            </div>
            <div class="bg-white/40 dark:bg-slate-800/40 rounded-2xl p-4 text-center">
              <i class="ph-bold ph-sunset text-3xl text-orange-500 mb-1 inline-block"></i>
              <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">日落時間</p>
              <p id="sunsetTime" class="text-lg font-bold mt-0.5">--:--</p>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-white/80 dark:text-slate-400 font-medium">
      <p>資料來源：<a href="https://open-meteo.com/" target="_blank" rel="noopener" class="underline hover:text-white">Open-Meteo API</a> | 台灣即時天氣 Web App</p>
    </footer>

  </div>

  <script>
    /**
     * Taiwan Major Cities & County Coordinates Directory
     */
    const TAIWAN_CITIES = [
      { name: "基隆市", lat: 25.1283, lon: 121.7419 },
      { name: "臺北市", lat: 25.0330, lon: 121.5654 },
      { name: "新北市", lat: 25.0170, lon: 121.4625 },
      { name: "桃園市", lat: 24.9936, lon: 121.3010 },
      { name: "新竹市", lat: 24.8138, lon: 120.9675 },
      { name: "新竹縣", lat: 24.8387, lon: 121.0177 },
      { name: "苗栗縣", lat: 24.5602, lon: 120.8214 },
      { name: "臺中市", lat: 24.1477, lon: 120.6736 },
      { name: "彰化縣", lat: 24.0518, lon: 120.5161 },
      { name: "南投縣", lat: 23.9037, lon: 120.6859 },
      { name: "雲林縣", lat: 23.7092, lon: 120.4313 },
      { name: "嘉義市", lat: 23.4800, lon: 120.4491 },
      { name: "嘉義縣", lat: 23.4588, lon: 120.5740 },
      { name: "臺南市", lat: 22.9997, lon: 120.2270 },
      { name: "高雄市", lat: 22.6273, lon: 120.3014 },
      { name: "屏東縣", lat: 22.6713, lon: 120.4880 },
      { name: "宜蘭縣", lat: 24.7570, lon: 121.7530 },
      { name: "花蓮縣", lat: 23.9757, lon: 121.6044 },
      { name: "臺東縣", lat: 22.7613, lon: 121.1444 },
      { name: "澎湖縣", lat: 23.5711, lon: 119.5793 },
      { name: "金門縣", lat: 24.4493, lon: 118.3766 },
      { name: "連江縣(馬祖)", lat: 26.1505, lon: 119.9499 }
    ];

    /**
     * WMO Weather Interpretation Codes (WW) Mapper
     */
    const WEATHER_CODES = {
      0: { name: "晴朗", icon: "ph-sun", color: "text-amber-500", type: "sunny" },
      1: { name: "大致晴朗", icon: "ph-sun-dim", color: "text-amber-400", type: "sunny" },
      2: { name: "多雲", icon: "ph-cloud-sun", color: "text-sky-500", type: "cloudy" },
      3: { name: "陰天", icon: "ph-cloud", color: "text-slate-500", type: "cloudy" },
      45: { name: "有霧", icon: "ph-cloud-fog", color: "text-slate-400", type: "cloudy" },
      48: { name: "霧霧/霜霧", icon: "ph-cloud-fog", color: "text-slate-400", type: "cloudy" },
      51: { name: "輕微細雨", icon: "ph-cloud-drizzle", color: "text-blue-400", type: "rainy" },
      53: { name: "適度細雨", icon: "ph-cloud-drizzle", color: "text-blue-500", type: "rainy" },
      55: { name: "濃密細雨", icon: "ph-cloud-drizzle", color: "text-blue-600", type: "rainy" },
      61: { name: "小雨", icon: "ph-cloud-rain", color: "text-sky-600", type: "rainy" },
      63: { name: "適度降雨", icon: "ph-cloud-rain", color: "text-blue-600", type: "rainy" },
      65: { name: "豪雨", icon: "ph-cloud-heavy-rain", color: "text-indigo-600", type: "rainy" },
      80: { name: "輕微陣雨", icon: "ph-cloud-rain", color: "text-sky-500", type: "rainy" },
      81: { name: "適度陣雨", icon: "ph-cloud-rain", color: "text-blue-500", type: "rainy" },
      82: { name: "強烈陣雨", icon: "ph-cloud-heavy-rain", color: "text-blue-700", type: "rainy" },
      95: { name: "雷陣雨", icon: "ph-cloud-lightning", color: "text-purple-600", type: "rainy" },
      96: { name: "雷陣雨伴隨冰雹", icon: "ph-cloud-lightning", color: "text-purple-700", type: "rainy" }
    };

    // State Variables
    let currentCity = TAIWAN_CITIES[1]; // Default: Taipei City

    // DOM Elements
    const citySelect = document.getElementById('citySelect');
    const geoBtn = document.getElementById('geoBtn');
    const themeToggle = document.getElementById('themeToggle');
    const themeToggleMobile = document.getElementById('themeToggleMobile');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    // Initialize Application
    document.addEventListener('DOMContentLoaded', () => {
      populateCityDropdown();
      initTheme();
      fetchWeatherData(currentCity.lat, currentCity.lon, currentCity.name);

      // Event Listeners
      citySelect.addEventListener('change', handleCityChange);
      geoBtn.addEventListener('click', handleGeolocation);
      themeToggle.addEventListener('click', toggleTheme);
      themeToggleMobile.addEventListener('click', toggleTheme);
    });

    /**
     * Populate Cities Select Dropdown
     */
    function populateCityDropdown() {
      citySelect.innerHTML = TAIWAN_CITIES.map(city => 
        `<option value="${city.lat},${city.lon}">${city.name}</option>`
      ).join('');
      // Set default to Taipei
      citySelect.selectedIndex = 1;
    }

    /**
     * Theme Toggle Logic
     */
    function initTheme() {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    }

    /**
     * Toast Notifications
     */
    function showToast(message) {
      toastMsg.textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => hideToast(), 4000);
    }

    function hideToast() {
      toast.classList.add('hidden');
    }

    /**
     * Handle City Dropdown Selection Change
     */
    function handleCityChange(e) {
      const [lat, lon] = e.target.value.split(',').map(Number);
      const selectedOption = e.target.options[e.target.selectedIndex];
      const cityName = selectedOption.text;
      currentCity = { name: cityName, lat, lon };
      fetchWeatherData(lat, lon, cityName);
    }

    /**
     * Handle Browser Geolocation
     */
    function handleGeolocation() {
      if (!navigator.geolocation) {
        showToast("您的瀏覽器不支援地理定位功能");
        return;
      }

      showToast("正在取得您的位置資訊...");

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          fetchWeatherData(lat, lon, "當前定位位置");
        },
        (error) => {
          console.error(error);
          showToast("無法取得位置，請確認定位權限設定。");
        },
        { timeout: 10000, enableHighAccuracy: true }
      );
    }

    /**
     * Fetch Weather Data from Open-Meteo API
     */
    async function fetchWeatherData(lat, lon, locationName) {
      // API Endpoint URL with comprehensive fields
      const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,weather_code,surface_pressure,wind_speed_10m,uv_index&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max&timezone=Asia%2FTaipei`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("天氣資料載入失敗");
        const data = await response.json();
        
        // Render UI with fetched data
        renderWeatherUI(data, locationName);
      } catch (err) {
        console.error("Open-Meteo Fetch Error:", err);
        showToast("連線天氣服務失敗，請稍後再試。");
      }
    }

    /**
     * Update Dynamic Background theme according to weather
     */
    function updateThemeBackground(weatherType) {
      const body = document.body;
      body.classList.remove('bg-sunny', 'bg-cloudy', 'bg-rainy');
      if (weatherType === 'rainy') {
        body.classList.add('bg-rainy');
      } else if (weatherType === 'cloudy') {
        body.classList.add('bg-cloudy');
      } else {
        body.classList.add('bg-sunny');
      }
    }

    /**
     * Main Render Function
     */
    function renderWeatherUI(data, locationName) {
      const current = data.current;
      const daily = data.daily;
      const hourly = data.hourly;

      const codeInfo = WEATHER_CODES[current.weather_code] || { name: "多雲", icon: "ph-cloud", color: "text-sky-500", type: "cloudy" };

      // Dynamic theme update
      updateThemeBackground(codeInfo.type);

      // Header Location & Time Info
      document.getElementById('cityName').textContent = locationName;
      const now = new Date();
      document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-TW', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'long'
      });
      document.getElementById('updateTime').textContent = `更新時間: ${now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`;

      // Current Main Display
      document.getElementById('tempCurrent').textContent = Math.round(current.temperature_2m);
      document.getElementById('weatherCondition').textContent = codeInfo.name;
      document.getElementById('weatherIcon').innerHTML = `<i class="ph-bold ${codeInfo.icon} ${codeInfo.color}"></i>`;

      // Weather Sub Details
      document.getElementById('feelsLike').textContent = `${Math.round(current.apparent_temperature)}°C`;
      document.getElementById('tempRange').textContent = `${Math.round(daily.temperature_2m_max[0])}° / ${Math.round(daily.temperature_2m_min[0])}°C`;
      document.getElementById('pop').textContent = `${current.precipitation_probability ?? daily.precipitation_probability_max[0] ?? 0}%`;

      // Grid Metrics
      document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
      document.getElementById('windSpeed').textContent = `${current.wind_speed_10m} km/h`;
      document.getElementById('uvIndex').textContent = `${current.uv_index !== undefined ? current.uv_index.toFixed(1) : '--'}`;
      document.getElementById('pressure').textContent = `${Math.round(current.surface_pressure)} hPa`;

      // Sunrise / Sunset
      if (daily.sunrise && daily.sunset) {
        const formatTime = (isoStr) => new Date(isoStr).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
        document.getElementById('sunriseTime').textContent = formatTime(daily.sunrise[0]);
        document.getElementById('sunsetTime').textContent = formatTime(daily.sunset[0]);
      }

      // Render Hourly Forecast (Next 24 Hours)
      renderHourlyForecast(hourly);

      // Render 7-Day Forecast
      renderDailyForecast(daily);
    }

    /**
     * Render Hourly Forecast Horizontal List
     */
    function renderHourlyForecast(hourly) {
      const container = document.getElementById('hourlyContainer');
      const currentHour = new Date().getHours();
      
      // Get 24 data points starting from current hour
      let html = '';
      for (let i = currentHour; i < currentHour + 24 && i < hourly.time.length; i++) {
        const timeStr = new Date(hourly.time[i]).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
        const temp = Math.round(hourly.temperature_2m[i]);
        const code = hourly.weather_code[i];
        const pop = hourly.precipitation_probability[i];
        const codeInfo = WEATHER_CODES[code] || { icon: "ph-cloud", color: "text-sky-500" };

        html += `
          <div class="flex-shrink-0 w-20 bg-white/40 dark:bg-slate-800/40 rounded-2xl p-3 text-center flex flex-col justify-between items-center transition-transform hover:scale-105 border border-white/20 dark:border-slate-700/30">
            <span class="text-xs font-medium text-slate-500 dark:text-slate-400">${i === currentHour ? '現在' : timeStr}</span>
            <i class="ph-bold ${codeInfo.icon} ${codeInfo.color} text-2xl my-2"></i>
            <span class="text-sm font-bold text-slate-800 dark:text-slate-100">${temp}°C</span>
            <span class="text-[10px] text-sky-600 dark:text-sky-400 font-semibold mt-1 flex items-center justify-center gap-0.5">
              <i class="ph-bold ph-drop"></i>${pop}%
            </span>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    /**
     * Render 7-Day Forecast List
     */
    function renderDailyForecast(daily) {
      const container = document.getElementById('dailyContainer');
      const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

      let html = '';
      for (let i = 0; i < daily.time.length; i++) {
        const dateObj = new Date(daily.time[i]);
        const dayLabel = i === 0 ? "今天" : days[dateObj.getDay()];
        const dateFormatted = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
        const maxTemp = Math.round(daily.temperature_2m_max[i]);
        const minTemp = Math.round(daily.temperature_2m_min[i]);
        const pop = daily.precipitation_probability_max[i] || 0;
        const codeInfo = WEATHER_CODES[daily.weather_code[i]] || { name: "多雲", icon: "ph-cloud", color: "text-sky-500" };

        html += `
          <div class="flex items-center justify-between p-3.5 bg-white/30 dark:bg-slate-800/30 rounded-2xl border border-white/20 dark:border-slate-700/20 text-sm">
            <div class="w-24">
              <p class="font-bold text-slate-800 dark:text-slate-100">${dayLabel}</p>
              <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${dateFormatted}</p>
            </div>
            
            <div class="flex items-center gap-2 flex-1 justify-center">
              <i class="ph-bold ${codeInfo.icon} ${codeInfo.color} text-xl"></i>
              <span class="text-xs text-slate-600 dark:text-slate-300 font-medium hidden sm:inline">${codeInfo.name}</span>
            </div>

            <div class="w-16 text-right">
              <span class="text-xs text-sky-600 dark:text-sky-400 font-semibold flex items-center justify-end gap-0.5">
                <i class="ph-bold ph-drop"></i>${pop}%
              </span>
            </div>

            <div class="w-24 text-right font-semibold">
              <span class="text-slate-900 dark:text-slate-100">${maxTemp}°</span>
              <span class="text-slate-400 dark:text-slate-500 mx-1">/</span>
              <span class="text-slate-500 dark:text-slate-400">${minTemp}°</span>
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }
  </script>
</body>
</html>
